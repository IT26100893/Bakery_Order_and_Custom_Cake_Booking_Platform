<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Orders')}"></head>

<body>

<nav th:replace="~{fragments :: nav('orders')}"></nav>

<main>

 <h1>Orders</h1>

 <p style="color:var(--muted);margin-top:-1rem;margin-bottom:2rem;">
  Create and manage customer bakery orders.
 </p>

 <div class="error"
      th:if="${error}"
      th:text="${error}"
      role="alert">
 </div>

 <div class="grid">

  <!-- ORDER FORM -->
  <section class="card">

   <h2>Place an Order</h2>

   <form method="post" action="/admin/orders/place">

    <label for="customer">Customer name</label>

    <input id="customer"
           name="customer"
           required
           placeholder="Enter customer name">

    <label for="productId">Select Product</label>

    <select id="productId" name="productId" required>

     <option th:each="p : ${products}"
             th:value="${p.id}"
             th:selected="${param.productId != null and param.productId[0] == #strings.toString(p.id)}"
             th:text="${p.name + ' - Rs. ' + #numbers.formatDecimal(p.price,1,2) + ' (' + p.stock + ' left)'}">
     </option>

    </select>

    <label for="qty">Quantity</label>

    <input id="qty"
           name="qty"
           type="number"
           min="1"
           value="1"
           required>

    <label for="payment">Payment Method</label>

    <select id="payment" name="payment">
     <option value="CASH">💵 Cash — No fee</option>
     <option value="CARD">💳 Card — 2% fee</option>
     <option value="ONLINE">📱 Online — 1.5% fee</option>
    </select>

    <div class="form-actions">
     <button class="btn" type="submit">🛒 Place Order</button>
    </div>

   </form>

  </section>


  <!-- ORDER LIST -->
  <section class="card">

   <div class="wrap">

    <table>

     <thead>
     <tr>
      <th>Customer</th>
      <th>Items</th>
      <th>Payment</th>
      <th>Total</th>
      <th>Status</th>
      <th>Action</th>
     </tr>
     </thead>

     <tbody>

     <tr th:each="o : ${items}">

      <td>
       <strong th:text="${o.customerName}">Customer</strong>
      </td>

      <td>
       <div th:each="i : ${o.items}"
            th:text="${i.qty + ' × ' + i.productName}">
       </div>
      </td>

      <td th:text="${o.payment.type}">CASH</td>

      <td>
       <strong>
        Rs.
        <span th:text="${#numbers.formatDecimal(o.total,1,'COMMA',2,'POINT')}">0.00</span>
       </strong>
      </td>

      <td>
       <form class="inline"
             method="post"
             th:action="@{/admin/orders/status/{id}(id=${o.id})}">

        <select name="status"
                onchange="this.form.submit()"
                aria-label="Order status">

         <option th:each="s : ${ {'PLACED','BAKING','READY','DELIVERED','CANCELLED'} }"
                 th:value="${s}"
                 th:text="${s}"
                 th:selected="${o.status == s}">
         </option>

        </select>

       </form>
      </td>

      <td>
       <form class="inline"
             method="post"
             th:action="@{/admin/orders/delete/{id}(id=${o.id})}"
             onsubmit="return confirm('Delete this order?')">

        <button class="btn sm" type="submit">Delete</button>

       </form>
      </td>

     </tr>

     </tbody>

    </table>

   </div>

   <p class="empty" th:if="${#lists.isEmpty(items)}">
    🛒 No orders yet. Place the first order using the form.
   </p>

  </section>

 </div>

</main>

</body>
</html>
